server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Graphs can carry embedded media as data URLs.
    client_max_body_size 25m;

    # Scan API — proxied to the backend container. Paths are unchanged so the
    # backend stays root-relative (BASE_PATH is unset in Docker).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scans are async (POST returns immediately, the UI polls), but PDFs
        # and result payloads can still take a moment to stream.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed Vite assets — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
